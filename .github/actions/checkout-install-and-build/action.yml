name: "Install and build"
description: "Setup environment, install dependencies and build project"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        registry-url: "https://registry.npmjs.org"
        cache: "npm"

    - name: Install Dependencies
      shell: bash
      run: npm install --audit=false --fund=false

    - name: Commit And Push package-lock.json
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package-lock.json

        if git diff --cached --quiet; then
          echo "No package-lock.json changes to commit."
          exit 0
        fi

        git commit -m "chore: update package-lock.json [skip ci]"
        git push origin "HEAD:feat/v6-lerna-9"

    - name: Build Packages
      shell: bash
      run: npm run build:prod
