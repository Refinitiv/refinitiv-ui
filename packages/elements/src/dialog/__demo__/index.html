<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Dialog</title>
    <style>
      textarea {
        height: 100px;
        resize: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Translations
      import '@refinitiv-ui/phrasebook/locale/de/dialog.js';
      import '@refinitiv-ui/phrasebook/locale/ja/dialog.js';
      import '@refinitiv-ui/phrasebook/locale/zh-hant/dialog.js';
      import '@refinitiv-ui/phrasebook/locale/zh/dialog.js';
    </script>
    <script type="module">
      import '@refinitiv-ui/elements/button';
      import '@refinitiv-ui/elements/checkbox';
      import '@refinitiv-ui/elements/dialog';

      import '@refinitiv-ui/demo-block';
      import '@refinitiv-ui/demo-block/demo.css';

      // Dynamic import theme files from search params of the URL
      // Ex. http://localhost:3000?theme=halo&varint=dark will load halo-theme/dark
      const url = new URL(window.location);
      const theme = url.searchParams.get('theme') || 'halo';
      const variant = url.searchParams.get('variant') || 'light';

      if (!window.location.search) {
        url.searchParams.set('theme', theme);
        url.searchParams.append('variant', variant);
        window.location.search = url.searchParams.toString();
      }

      import(`../../../../../node_modules/@refinitiv-ui/${theme}-theme/${variant}/css/native-elements.css`);
      import(`../../../lib/dialog/themes/${theme}/${variant}/index.js`);
      import(`../../../lib/checkbox/themes/${theme}/${variant}/index.js`);
      import(`../../../lib/button/themes/${theme}/${variant}/index.js`);
    </script>
    <script type="module">
      window.openDialog = (id, withBackdrop) => {
        const dialog = document.getElementById(id);
        dialog.withBackdrop = !!withBackdrop;
        dialog.opened = true;
      };

      window.openDialogTranslated = (id, lang) => {
        const dialog = document.getElementById(id);
        dialog.lang = lang;
        openDialog(id);
      };
    </script>

    <demo-block header="Default Header" tags="default,header">
      <ef-button id="open_btn">Open dialog</ef-button>
      <hr />
      <ef-dialog>
        <efx-grid></efx-grid>
      </ef-dialog>
      <style>
        /* TODO: user need to set zIndex for avoid auto zindex calculation */
        filter-dialog {
          position: fixed;
          pointer-events: auto;
          z-index: 1000;
        }
        ef-dialog {
          z-index: 0 !important;
        }
      </style>
      <script type="module">
        import '@refinitiv-ui/efx-grid';
        import { RowFiltering } from '@refinitiv-ui/efx-grid/extensions';
        import '@refinitiv-ui/efx-grid/filter-dialog';
        import '@refinitiv-ui/efx-grid/filter-dialog/themes/halo/light';
        import '@refinitiv-ui/efx-grid/themes/halo/light';
        import { DataGenerator } from '@refinitiv-ui/efx-grid/utils';

        (function () {
          open_btn.addEventListener('click', function () {
            var dialog = document.querySelector('ef-dialog');
            var grid = document.querySelector('efx-grid');
            dialog.zIndex = 0; // TODO: user need to set zIndex for overlay backdrop
            dialog.opened = true;
          });

          var fields = ['id', 'companyName', 'market'];
          var columns = fields.map(function (f) {
            return {
              field: f
            };
          });
          columns[0].width = 50; // id column

          var ROW_COUNT = 10;
          var records = DataGenerator.generateRecords(fields, {
            seed: 0,
            numRows: ROW_COUNT
          });

          var configObj = {
            rowFiltering: {
              iconActivation: 'always'
            },
            columns: columns,
            staticDataRows: records,
            extensions: [new RowFiltering()]
          };

          var grid = document.querySelector('efx-grid');
          grid.config = configObj;
        })();
      </script>
    </demo-block>
  </body>
</html>
